<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Year First</title>
<style>
  :root {
    --ink: #16191d;
    --muted: #5c6570;
    --line: #dfe3e8;
    --bg: #ffffff;
    --field: #f4f6f8;
    --accent: #9a5e0a;
    --off: #b9c0c8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e7eaee; --muted: #99a3ae; --line: #333940;
      --bg: #1c1f24; --field: #24282e; --accent: #e9a93c; --off: #4a5158;
    }
  }

  * { box-sizing: border-box; }
  body {
    width: 268px; margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font: 13.5px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* master switch */
  .master {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 14px 13px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .master .label { flex: 1; }
  .master .name { font-weight: 600; display: block; }
  .master .state { color: var(--muted); font-size: 12px; }
  .master input { position: absolute; opacity: 0; pointer-events: none; }

  .switch {
    flex: none; width: 38px; height: 22px; border-radius: 11px;
    background: var(--off); position: relative; transition: background .15s;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: transform .15s;
  }
  input:checked + .switch { background: var(--accent); }
  input:checked + .switch::after { transform: translateX(16px); }
  input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* format preview, dimmed when off */
  .sample {
    padding: 11px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  .sample b { color: var(--accent); font-weight: 600; }
  body.off .sample b { color: var(--muted); font-weight: 400; }
  body.off .rows { opacity: .45; pointer-events: none; }

  .rows { padding: 6px 6px 8px; }
  label.row {
    display: flex; gap: 9px; align-items: center;
    padding: 7px 8px; border-radius: 5px; cursor: pointer;
  }
  label.row:hover { background: var(--field); }
  label.row input { margin: 0; accent-color: var(--accent); flex: none; }
  label.row:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; }

  .foot {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 14px 12px; border-top: 1px solid var(--line);
  }
  button {
    font: inherit; font-size: 12.5px; padding: 5px 10px;
    border-radius: 5px; cursor: pointer; border: 1px solid var(--line);
    background: transparent; color: var(--ink);
  }
  button:hover { background: var(--field); }
  button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { color: #2a1b05; } }
  button.primary[hidden] { display: none; }
  .spacer { flex: 1; }

  @media (prefers-reduced-motion: reduce) {
    .switch, .switch::after { transition: none; }
  }
</style>
</head>
<body>

<label class="master">
  <span class="label">
    <span class="name">Rewrite dates</span>
    <span class="state" id="state">On for every site</span>
  </span>
  <input type="checkbox" id="enabled">
  <span class="switch" aria-hidden="true"></span>
</label>

<div class="sample">23/07/2024 &rarr; <b>2024-07-23</b></div>

<div class="rows">
  <label class="row">
    <input type="checkbox" id="highlight">
    <span>Underline rewritten dates</span>
  </label>
  <label class="row">
    <input type="checkbox" id="showOriginal">
    <span>Original text as a tooltip</span>
  </label>
</div>

<div class="foot">
  <button id="settings">All settings</button>
  <span class="spacer"></span>
  <button id="reload" class="primary" hidden>Reload page</button>
</div>

<script src="popup.js"></script>
</body>
</html>
