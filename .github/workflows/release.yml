name: Release

# Tag a commit (e.g. v1.0.0) to build the three store zips and attach them
# to a GitHub Release. Store submission stays manual.
on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build and attach store zips
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build.py --zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
