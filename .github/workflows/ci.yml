name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Date logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Pass the files explicitly rather than the directory. `node --test test/`
      # resolves a bare directory as a module entry point on some versions
      # (it works on 20 and 26, and fails on 24), so the glob avoids relying
      # on behaviour that has changed twice.
      - run: node --test test/*.test.js

  dist-in-sync:
    # dist/ is committed, and the README promises it is loadable without
    # running the build. That only stays true if it matches src/, so rebuild
    # and fail on any difference.
    name: dist/ matches a fresh build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 build.py
      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'python3 build.py' and commit the result."
            git status --short -- dist/
            git diff -- dist/
            exit 1
          fi
          echo "dist/ is in sync with src/"
