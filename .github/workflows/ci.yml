name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Date logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      # jsdom is a test-only dependency. The extension itself ships none --
      # build.py copies src/ alone, so dist/ never sees node_modules.
      - run: npm ci
      # npm test passes the files explicitly rather than the directory.
      # `node --test test/` resolves a bare directory as a module entry point
      # on some versions (works on 20 and 26, fails on 24).
      - run: npm test

  dist-in-sync:
    # dist/ is committed, and the README promises it is loadable without
    # running the build. That only stays true if it matches src/, so rebuild
    # and fail on any difference.
    name: dist/ matches a fresh build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 build.py
      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'python3 build.py' and commit the result."
            git status --short -- dist/
            git diff -- dist/
            exit 1
          fi
          echo "dist/ is in sync with src/"
